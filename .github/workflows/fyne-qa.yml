name: Проверка с выбранной веткой Granio
on:
  workflow_call:
    inputs:
      branch:
        required: false
        default: dev/granio
        type: string
      tags:
        required: false
        default: migrated_fynedo,ci
        type: string
permissions:
  contents: read
env:
  GOWORK: "off"
jobs:
  qa:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Uzer007-admin/granio
          ref: ${{ inputs.branch }}
          path: .granio-source
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Подключить исходники Granio
        run: go mod edit -replace github.com/Uzer007-admin/granio/v2=./.granio-source
      - name: Согласовать зависимости
        run: go mod tidy
      - name: Тесты
        env:
          GRANIO_TEST_TAGS: ${{ inputs.tags }}
        run: go test -race -tags "$GRANIO_TEST_TAGS" ./...
